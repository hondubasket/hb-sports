services:
  - type: web
    name: hb-sports
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: AIRTABLE_TOKEN
        sync: false
      - key: PLAYERS_BASE
        value: appeSfTpQN0rm03K1
      - key: PLAYERS_TABLE
        value: tblyoZQvvWdbwCdwj
      - key: CLUBS_BASE
        value: appWAZgIGnaS2kSm3
      - key: CLUBS_TABLE
        value: tblnUhNw4kpVuuhem
      - key: ADMIN_PIN
        value: hb2026

  # Sitio público de estadísticas: archivos estáticos servidos por CDN.
  # Gratis y nunca se duerme (a diferencia del servicio web del plan free).
  - type: web
    name: hb-sports-estadisticas
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    routes:
      # La gestión de la Liga de las Estrellas sigue usando la API del servidor
      - type: rewrite
        source: /api/*
        destination: https://hb-sports.onrender.com/api/*
