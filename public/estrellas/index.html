<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga de las Estrellas 2026 | HB Sports</title>
<meta name="description" content="Resultados y tablas de posiciones de la Liga de las Estrellas 2026 por categoría, de U10 a U18.">
<link rel="icon" href="/img/liga.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
:root{
  --purple:#4B2E83;--purple-deep:#2A1659;--purple-dark:#1C0E3D;--purple-soft:#F2EDFA;
  --orange:#E8610A;--orange-bright:#FF7518;--orange-soft:#FFF3E8;
  --ink:#1A1430;--slate:#6B6480;--line:#E7E1F0;--paper:#FBFAFD;--white:#FFFFFF;
  --good:#1E8A6F;--bad:#C0395E;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Sora','Inter',sans-serif;letter-spacing:-.02em;line-height:1.15}
a{color:inherit}
.top{background:#fff;border-bottom:4px solid var(--orange)}
.top-in{max-width:1200px;margin:0 auto;padding:14px 20px}
.brand{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brandl{display:flex;align-items:center;gap:16px;min-width:0}
.brandl img{height:58px;width:auto}
.brand small{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange)}
.brand h1{font-size:clamp(18px,3vw,26px);font-weight:800;margin-top:3px;color:var(--purple)}
.links{display:flex;gap:14px;font-size:13px;font-weight:600}
.links a{color:var(--slate);text-decoration:none}.links a:hover{color:var(--orange)}
.catbar{background:var(--purple)}
.catbar nav{max-width:1200px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.catbar a{flex:none;text-decoration:none;color:#D8CCF0;font-weight:600;font-size:14px;padding:12px 14px;border-bottom:3px solid transparent}
.catbar a:hover{color:#fff}
.catbar a.on{color:#fff;border-bottom-color:var(--orange-bright)}
.catbar a.off{opacity:.55}
.wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px}
.head{margin-bottom:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.head h2{font-size:28px;font-weight:800;color:var(--purple)}
.head p{color:var(--slate);margin-top:6px;max-width:68ch}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h3{font-size:17px;margin-bottom:12px}
.stack{display:grid;gap:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.empty{padding:30px 18px;text-align:center;color:var(--slate);border:1px dashed var(--line);border-radius:var(--radius);background:#fff}
.empty b{display:block;color:var(--ink);font-family:Sora;font-size:17px;margin-bottom:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--slate);background:#F7F4FB}
th.l,td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
td.b{font-weight:800;font-family:Sora}
tr.top4 td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
.round{margin-bottom:16px}
.round h4{font-family:Sora;font-size:14px;color:var(--purple);margin-bottom:6px}
.game{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px}
.game .t{font-weight:600;font-size:14px}
.game .t.l{color:var(--slate);font-weight:500}
.game .s{font-family:Sora;font-weight:800;text-align:right}
.game.wo{position:relative}.game.wo::after{content:"W.O.";position:absolute;right:46px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--slate);background:#F1F0F4;padding:3px 7px;border-radius:99px}
.game .p{grid-row:1/3;grid-column:2;align-self:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);background:var(--orange-soft);padding:4px 8px;border-radius:99px}
.catcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-decoration:none;display:grid;gap:8px}
.catcard:hover{border-color:var(--purple)}
.catcard h3{font-size:18px;color:var(--purple)}
.catcard .m{font-size:13px;color:var(--slate)}
.catcard .ldr{font-weight:600;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--purple-soft);color:var(--purple)}
.pill.wait{background:#F1F0F4;color:var(--slate)}
.note{font-size:13px;color:var(--slate)}
.foot{border-top:1px solid var(--line);padding:22px 20px;text-align:center;color:var(--slate);font-size:13px}
.foot b{color:var(--purple)}
@media(max-width:600px){.brandl img{height:42px}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">
  <div class="brandl"><img src="/img/liga.png" alt="Liga de las Estrellas"><div><small>Temporada 2026 · Resultados oficiales</small><h1>Liga de las Estrellas 2026</h1></div></div>
  <div class="links"><a href="/">← Todas las ligas</a><a href="/estrellas/gestion/">Gestión</a></div>
</div></div>
<div class="catbar"><nav id="cats"></nav></div>
</header>
<main class="wrap" id="view"><div class="empty"><b>Cargando resultados</b>Un momento…</div></main>
<footer class="foot">Datos servidos por <b>HB Sports</b> · Hondubasket · Resultados registrados en Score7<br><span id="upd"></span></footer>
<script>
let D={categorias:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fdate=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return `${+dd} ${MES[+m-1]} ${y}`};
const played=p=>p.pl!=null&&p.pv!=null;
const tc=s=>String(s).toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase()).replace(/ (De|Del|La|Las|Los|Y) /g,m=>m.toLowerCase());
function allGames(c){return(c.rondas||[]).flatMap(r=>r.partidos.map(p=>({...p,ronda:r.ronda})))}
function table(c){
  const W=D.puntos?.victoria??2,L=D.puntos?.derrota??1,t={};
  const add=n=>t[n]??=(t[n]={team:n,pj:0,g:0,p:0,pf:0,pc:0});
  allGames(c).forEach(p=>{add(p.local);add(p.visita);if(!played(p))return;const a=t[p.local],b=t[p.visita];
    a.pj++;b.pj++;a.pf+=p.pl;a.pc+=p.pv;b.pf+=p.pv;b.pc+=p.pl;if(p.pl>p.pv){a.g++;b.p++}else if(p.pv>p.pl){b.g++;a.p++}});
  return Object.values(t).map(x=>({...x,dif:x.pf-x.pc,pts:W*x.g+L*x.p})).sort((x,y)=>y.pts-x.pts||y.dif-x.dif||y.pf-x.pf||x.team.localeCompare(y.team));
}
function standTable(c){
  const st=table(c);
  return `<div class="tbl"><table><thead><tr><th class="l">#</th><th class="l">Equipo</th><th>PJ</th><th>G</th><th>P</th><th>PF</th><th>PC</th><th>DIF</th><th>PTS</th></tr></thead><tbody>${st.map((t,i)=>`<tr class="${i<4?"top4":""}"><td class="l">${i+1}</td><td class="l"><b>${esc(tc(t.team))}</b></td><td>${t.pj}</td><td>${t.g}</td><td>${t.p}</td><td>${t.pf}</td><td>${t.pc}</td><td style="color:${t.dif>0?"var(--good)":t.dif<0?"var(--bad)":"inherit"}">${t.dif>0?"+":""}${t.dif}</td><td class="b">${t.pts}</td></tr>`).join("")}</tbody></table></div>`;
}
function game(p){
  const f=played(p),w=(x,y)=>f&&x<y?"l":"",wo=f&&((p.pl===20&&p.pv===0)||(p.pl===0&&p.pv===20));
  return `<div class="game${wo?" wo":""}"><span class="t ${w(p.pl,p.pv)}">${esc(tc(p.local))}</span>${f?`<span class="s">${p.pl}</span>`:`<span class="p">Pendiente</span>`}<span class="t ${w(p.pv,p.pl)}">${esc(tc(p.visita))}</span>${f?`<span class="s">${p.pv}</span>`:""}</div>`;
}
function viewCat(c){
  if(!(c.rondas||[]).length)return `<div class="head"><div class="eyebrow">Categoría</div><h2>${esc(c.nombre)}</h2></div><div class="empty"><b>Resultados por publicar</b>La tabla y los partidos de esta categoría aparecen aquí en cuanto se carguen.</div>`;
  const g=allGames(c),pj=g.filter(played).length;
  return `<div class="stack"><div class="head"><div class="eyebrow">Categoría · ${pj} de ${g.length} partidos jugados</div><h2>${esc(c.nombre)}</h2><p>Tabla de posiciones y resultados por ronda. Victoria 2 puntos, derrota 1.</p></div>
  <div class="grid2" style="grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)">
    <section><h3 style="font-size:19px;margin-bottom:10px">Tabla de posiciones</h3>${standTable(c)}<p class="note" style="margin-top:8px">Desempate por diferencia de puntos y luego puntos a favor. W.O.: partido ganado por incomparecencia (20-0).</p></section>
    <section><h3 style="font-size:19px;margin-bottom:10px">Partidos por ronda</h3>${[...c.rondas].sort((a,b)=>b.ronda-a.ronda).map(r=>`<div class="round"><h4>Ronda ${r.ronda}</h4>${r.partidos.map(game).join("")}</div>`).join("")}</section>
  </div></div>`;
}
function viewAll(){
  return `<div class="stack"><div class="head"><div class="eyebrow">Temporada 2026</div><h2>Todas las categorías</h2><p>Elegí una categoría para ver su tabla de posiciones y todos sus resultados.</p></div>
  <div class="grid3">${D.categorias.map(c=>{const g=allGames(c),pj=g.filter(played).length,st=table(c);const lead=pj?st[0]:null;
    return `<a class="catcard" href="#${c.id}"><span>${g.length?`<span class="pill">${pj} jugados</span>`:`<span class="pill wait">Por publicar</span>`}</span><h3>${esc(c.nombre)}</h3>${lead?`<span class="ldr">Líder: ${esc(tc(lead.team))}</span><span class="m">${lead.g}-${lead.p} · ${lead.pts} pts</span>`:`<span class="m">Resultados próximamente</span>`}</a>`}).join("")}</div></div>`;
}
function route(){
  const h=location.hash.slice(1),c=D.categorias.find(x=>x.id===h);
  document.querySelectorAll("#cats a").forEach(a=>a.classList.toggle("on",(a.dataset.id||"")===(c?c.id:"")));
  $("#view").innerHTML=c?viewCat(c):viewAll();
}
window.addEventListener("hashchange",()=>{route();scrollTo(0,0)});
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{D=d;
  $("#cats").innerHTML=`<a href="#" data-id="">Todas</a>`+D.categorias.map(c=>`<a href="#${c.id}" data-id="${c.id}" class="${(c.rondas||[]).length?"":"off"}">${esc(c.nombre.replace("Masculino","M").replace("Femenino","F"))}</a>`).join("");
  $("#upd").textContent=d.actualizado?`Actualizado: ${fdate(d.actualizado)}`:"";route();
}).catch(()=>{$("#view").innerHTML=`<div class="empty"><b>No se pudieron cargar los resultados</b>Recargá la página en unos segundos.</div>`});
</script>
</body>
</html>
