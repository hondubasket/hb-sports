<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadísticas | Liga Nacional de Baloncesto Femenino ICN 2026</title>
<meta name="description" content="Estadísticas oficiales de la LNBF 2026: calendario, resultados, box scores, jugadores, líderes y posiciones. Datos servidos por HB Sports.">
<link rel="icon" href="img/lnbf.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
:root{
  /* Colores LNBF: azul noche y celeste */
  --purple:#0A1A33;--purple-deep:#050F20;--purple-dark:#0A1A33;--purple-soft:#EEF6F9;
  --orange:#3E9FB8;--orange-soft:#E6F4F8;--lime:#7CC8D8;--lime-soft:#E6F4F8;--navy:#0A1A33;
  --ink:#222222;--slate:#66676E;--line:#E4E5EA;--paper:#F7F7F8;--white:#FFFFFF;
  --good:#1E8A6F;--bad:#C0395E;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Sora','Inter',sans-serif;letter-spacing:-.02em;line-height:1.15}
a{color:inherit}
.top{background:#fff;color:var(--ink);border-bottom:4px solid var(--orange)}
.top-in{max-width:1200px;margin:0 auto;padding:14px 20px 0}
.brandl{display:flex;align-items:center;gap:18px;min-width:0}
.brandl img{height:58px;width:auto;flex:none}
.navbar{background:var(--purple);margin-top:14px}
.navbar nav{max-width:1200px;margin:0 auto;padding:0 12px}
.brand{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.brand small{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange)}
.brand h1{font-size:clamp(18px,3vw,26px);font-weight:800;margin-top:3px;color:var(--purple)}
@media(max-width:600px){.brandl img{height:40px}.brand h1{font-size:17px}}
.brand .back{font-size:13px;color:var(--slate);text-decoration:none;font-weight:600}
.brand .back:hover{color:var(--orange)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:#C9C9CC;font-weight:600;font-size:14px;padding:11px 15px;border-bottom:3px solid transparent}
nav a:hover{color:#fff}
nav a.on{color:#fff;border-bottom-color:var(--orange)}
.wrap{max-width:1200px;margin:0 auto;padding:26px 20px 70px}
.head{margin-bottom:20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
.head h2{font-size:28px;font-weight:800;color:var(--navy)}
.head p{color:var(--slate);margin-top:6px;max-width:68ch}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.stack{display:grid;gap:18px}
.card h3{font-size:17px;margin-bottom:12px}
.empty{padding:34px 18px;text-align:center;color:var(--slate);border:1px dashed var(--line);border-radius:var(--radius);background:var(--white)}
.empty b{display:block;color:var(--ink);font-family:Sora;font-size:17px;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--purple);color:#fff;border:0;padding:11px 18px;border-radius:10px;font:700 14px Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--purple-deep)}
.btn.orange{background:var(--orange)}
.btn.ghost{background:var(--white);color:var(--purple);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select{font:500 14px Inter,sans-serif;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}

/* games */
.games{display:grid;gap:8px}
.game{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none}
a.game:hover{border-color:var(--purple)}
.game .when{font-size:12px;color:var(--slate);line-height:1.35}
.game .when b{display:block;color:var(--ink);font-size:13px}
.mu{display:grid;gap:3px;min-width:0}
.mu div{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.mu .l{color:var(--slate);font-weight:500}
.mu .s{font-family:Sora;font-weight:800}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:99px;white-space:nowrap}
.tag.fin{background:var(--lime-soft);color:#4E7300}
.tag.prog{background:var(--orange-soft);color:var(--orange)}
.jhead{font-family:Sora;font-weight:700;font-size:15px;margin:18px 0 8px;color:var(--navy)}
@media(max-width:560px){.game{grid-template-columns:1fr auto}.game .when{grid-column:1/-1;display:flex;gap:8px}.game .when b{display:inline}}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--white)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--slate);background:#F3F4F7}
th.l,td.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFAFB}
tfoot td{font-weight:700;background:#F3F4F7}
th.s{cursor:pointer}th.s.on{color:var(--orange)}
td.b{font-weight:700}

/* leaders */
.board ol{list-style:none}
.board li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.board li:last-child{border-bottom:0}
.board .rk{font-family:Sora;font-weight:700;color:var(--slate)}
.board li:first-child .rk,.board li:first-child .v{color:var(--orange)}
.board .who{min-width:0}
.board .who b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .who span{font-size:12px;color:var(--slate)}
.board .v{font-family:Sora;font-weight:800;font-size:19px;text-align:right}
.board .v small{display:block;font:500 11px Inter;color:var(--slate)}
.board h3{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:2px}
.board h3 small{font:500 12px Inter;color:var(--slate)}

/* scoreboard */
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;background:var(--navy);color:#fff;border-radius:var(--radius);padding:22px;border-bottom:5px solid var(--orange)}
.sb .t{display:flex;align-items:center;gap:12px}.sb .t:last-child{justify-content:flex-end}
.sb .t .tl{width:64px;height:64px;padding:6px}
@media(max-width:560px){.sb .t,.sb .t:last-child{flex-direction:column;text-align:center;justify-content:center}.sb .t .tl{order:-1}.sb .t .tl{width:46px;height:46px}}
.sb .t{font-family:Sora;font-weight:700;font-size:clamp(15px,3vw,22px)}
.sb .t:last-child{text-align:right}
.sb .sc{font-family:Sora;font-weight:800;font-size:clamp(30px,6vw,48px);white-space:nowrap}
.sb .meta{grid-column:1/-1;text-align:center;color:#C8CBE0;font-size:13px}
.sb .sc{color:#fff}

.foot{border-top:1px solid var(--line);padding:22px 20px;text-align:center;color:var(--slate);font-size:13px}
.foot b{color:var(--orange)}
.tl{display:inline-block;flex:none;width:30px;height:30px;object-fit:contain;background:#fff;border-radius:8px;padding:2px;vertical-align:middle}
.tl.sm{width:22px;height:22px;border-radius:6px;padding:1px}
.tn{display:inline-flex;align-items:center;gap:9px;min-width:0}
.mu .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .v{color:var(--navy)}
.toast{background:var(--navy)!important}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);color:#fff;padding:10px 16px;border-radius:9px;font-weight:600;font-size:14px}
.top a.ytbtn{display:inline-flex;align-items:center;gap:7px;background:#FF0000;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:7px 12px;border-radius:9px;white-space:nowrap;line-height:1}
.top a.ytbtn:hover{background:#d90000;color:#fff}.top a.ytbtn svg{width:16px;height:16px;fill:#fff}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <div class="brandl"><img src="img/lnbf.png" alt="LNBF"><div><small>Temporada 2026 · Estadísticas oficiales</small><h1>Liga Nacional de Baloncesto Femenino ICN 2026</h1></div></div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><a class="ytbtn" href="https://www.youtube.com/@hondubasket" target="_blank" rel="noopener" aria-label="Transmisiones en vivo en YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg>Transmisiones en vivo</a><a class="back" href="/">← HB Sports</a></div>
  </div></div>
  <div class="navbar"><nav id="nav">
    <a href="#inicio" data-v="inicio">Inicio</a>
    <a href="#calendario" data-v="calendario">Calendario</a>
    <a href="#posiciones" data-v="posiciones">Posiciones</a>
    <a href="#equipos" data-v="equipos">Equipos</a>
    <a href="#jugadores" data-v="jugadores">Jugadores</a>
    <a href="#lideres" data-v="lideres">Líderes</a>
    <a href="#fotos" data-v="fotos">Fotos</a>
  </nav></div>
</header>
<main class="wrap" id="view"><div class="empty"><b>Cargando estadísticas</b>Un momento…</div></main>
<footer class="foot">Datos oficiales servidos por <b>HB Sports</b> · Hondubasket · © 2026 LNBF<br><span id="upd"></span></footer>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/galeria.js"></script>
<script>
const K=["min","p2m","p2a","p3m","p3a","ftm","fta","oreb","dreb","ast","stl","blk","tov","pf"];
let D={equipos:[],partidos:[]},FOTOS=[];
fetch("fotos.json",{cache:"no-store"}).then(r=>r.json()).then(f=>{FOTOS=f.fotos||[];if(location.hash==="#fotos")route()}).catch(()=>{});
const S={pTeam:"",pSort:{k:"ppg",d:-1},cTeam:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n=v=>{const x=Number(v);return Number.isFinite(x)?x:0};
const pts=r=>2*n(r.p2m)+3*n(r.p3m)+n(r.ftm);
const val=r=>pts(r)+n(r.oreb)+n(r.dreb)+n(r.ast)+n(r.stl)+n(r.blk)-(n(r.p2a)+n(r.p3a)-n(r.p2m)-n(r.p3m))-(n(r.fta)-n(r.ftm))-n(r.tov);
const sum=b=>{const t={pts:0};K.forEach(k=>t[k]=0);(b||[]).forEach(r=>{K.forEach(k=>t[k]+=n(r[k]));t.pts+=pts(r)});t.reb=t.oreb+t.dreb;return t};
const fmin=m=>{const t=Math.round(n(m)*60);return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`};
const pct=(m,a)=>a?(100*m/a).toFixed(1):"–";
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fdate=d=>{if(!d)return"Por definir";const[y,m,dd]=d.split("-");return `${+dd} ${MES[+m-1]} ${y}`};
const LOGO=t=>(D.equipos.find(e=>e.nombre===t)||{}).logo;
const lg=(t,c="")=>{const u=LOGO(t);return u?`<img class="tl ${c}" src="${esc(u)}" alt="" loading="lazy">`:""};
const tn=(t,c="")=>`<span class="tn">${lg(t,c)}<span>${esc(t)}</span></span>`;
const fin=()=>D.partidos.filter(g=>g.estado==="final");
const score=g=>[sum(g.boxLocal).pts||n(g.ptsLocal),sum(g.boxVisita).pts||n(g.ptsVisita)];
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)};

function players(){
  const map=new Map();
  for(const g of fin())for(const[side,team]of[["boxLocal",g.local],["boxVisita",g.visita]])for(const r of g[side]||[]){
    if(!r.nombre)continue;const key=team+"|"+(r.num!==undefined&&r.num!==""?"#"+r.num:r.nombre.trim().toLowerCase());let p=map.get(key);
    if(!p){p={team,nombre:r.nombre.trim(),num:r.num||"",gp:0,pts:0,val:0};K.forEach(k=>p[k]=0);map.set(key,p)}
    p.gp++;p.pts+=pts(r);p.val+=val(r);K.forEach(k=>p[k]+=n(r[k]));if(r.num)p.num=r.num;
  }
  return[...map.values()].map(p=>{const g=p.gp||1,reb=p.oreb+p.dreb;return{...p,reb,fgm:p.p2m+p.p3m,fga:p.p2a+p.p3a,ppg:p.pts/g,rpg:reb/g,orpg:p.oreb/g,drpg:p.dreb/g,apg:p.ast/g,spg:p.stl/g,bpg:p.blk/g,mpg:p.min/g,tpg:p.tov/g,vpg:p.val/g}});
}
function standings(){
  const t={};D.equipos.forEach(e=>t[e.nombre]={team:e.nombre,pj:0,g:0,p:0,pf:0,pc:0});
  for(const g of fin()){const[a,b]=score(g),A=t[g.local],B=t[g.visita];if(!A||!B)continue;
    A.pj++;B.pj++;A.pf+=a;A.pc+=b;B.pf+=b;B.pc+=a;if(a>b){A.g++;B.p++}else if(b>a){B.g++;A.p++}}
  return Object.values(t).map(x=>({...x,dif:x.pf-x.pc,pts:2*x.g+x.p})).sort((x,y)=>y.pts-x.pts||y.dif-x.dif||y.pf-x.pf);
}

function gameRow(g){
  const[a,b]=score(g),f=g.estado==="final",w=(x,y)=>!f||x>=y?"":"l";
  const inner=`<div class="when"><b>${esc(fdate(g.fecha))}</b>${esc(g.hora||"")} · J${esc(g.jornada)}</div>
  <div class="mu"><div class="${w(a,b)}">${tn(g.local,"sm")}<span class="s">${f?a:""}</span></div><div class="${w(b,a)}">${tn(g.visita,"sm")}<span class="s">${f?b:""}</span></div></div>
  <span class="tag ${f?"fin":"prog"}">${f?"Final":"Programado"}</span>`;
  return f?`<a class="game" href="#partido-${esc(g.id)}">${inner}</a>`:`<div class="game">${inner}</div>`;
}
function standTable(){
  return `<div class="tbl"><table><thead><tr><th class="l">#</th><th class="l">Equipo</th><th>PJ</th><th>G</th><th>P</th><th>PF</th><th>PC</th><th>DIF</th><th>PTS</th></tr></thead><tbody>${standings().map((t,i)=>`<tr><td class="l">${i+1}</td><td class="l"><b>${tn(t.team,"sm")}</b></td><td>${t.pj}</td><td>${t.g}</td><td>${t.p}</td><td>${t.pf}</td><td>${t.pc}</td><td style="color:${t.dif>0?"var(--good)":t.dif<0?"var(--bad)":"inherit"}">${t.dif>0?"+":""}${t.dif}</td><td class="b">${t.pts}</td></tr>`).join("")}</tbody></table></div>`;
}
function board(title,unit,list,v,sub){
  return `<section class="card board"><h3>${title}<small>${unit}</small></h3>${list.length?`<ol>${list.map((p,i)=>`<li><span class="rk">${i+1}</span><span class="who"><b>${esc(p.nombre)}</b><span>${tn(p.team,"sm")} · ${p.gp} PJ</span></span><span class="v">${v(p)}<small>${sub(p)}</small></span></li>`).join("")}</ol>`:`<p style="color:var(--slate);font-size:14px;padding-top:10px">Disponible con el primer partido final.</p>`}</section>`;
}

const V={
  inicio(){
    const up=D.partidos.filter(g=>g.estado!=="final").sort((a,b)=>(a.fecha||"9").localeCompare(b.fecha||"9")).slice(0,5);
    const last=fin().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).slice(0,5);
    const ps=players(),top=k=>[...ps].sort((a,b)=>b[k]-a[k]).slice(0,5);
    return `<div class="stack">
    <div class="grid2">
      <section class="card"><h3>Próximos partidos</h3>${up.length?`<div class="games">${up.map(gameRow).join("")}</div>`:`<p style="color:var(--slate)">El calendario se publica aquí jornada por jornada.</p>`}</section>
      <section class="card"><h3>Últimos resultados</h3>${last.length?`<div class="games">${last.map(gameRow).join("")}</div>`:`<p style="color:var(--slate)">Los resultados aparecen al cargar las actas oficiales.</p>`}</section>
    </div>
    <section><div class="head"><div class="eyebrow">Clasificación</div><h2>Tabla de posiciones</h2></div>${standTable()}</section>
    <div class="grid3">${board("Anotadores","PPJ",top("ppg"),p=>p.ppg.toFixed(1),p=>p.pts+" pts")}${board("Reboteadores","RPJ",top("rpg"),p=>p.rpg.toFixed(1),p=>p.reb+" reb")}${board("Asistidores","APJ",top("apg"),p=>p.apg.toFixed(1),p=>p.ast+" ast")}</div>
    </div>`;
  },
  calendario(){
    const list=[...D.partidos].sort((a,b)=>n(a.jornada)-n(b.jornada)||(a.fecha||"").localeCompare(b.fecha||""));
    if(!list.length)return head("Temporada 2026","Calendario y resultados","Todos los partidos de la temporada con su resultado y box score.")+`<div class="empty"><b>Calendario en preparación</b>Los partidos se publican aquí con fecha, hora y resultado.</div>`;
    const byJ={};list.forEach(g=>(byJ[g.jornada]??=[]).push(g));
    return head("Temporada 2026","Calendario y resultados","Tocá un partido final para ver su box score completo.")+Object.entries(byJ).map(([j,gs])=>`<div class="jhead">Jornada ${esc(j)} · ${esc(fdate(gs[0].fecha))}${gs[0].descansa?` <span style="color:var(--slate);font-weight:500;font-size:13px">· Descansa: ${esc(gs[0].descansa)}</span>`:""}</div><div class="games">${gs.map(gameRow).join("")}</div>`).join("")+playoffs();
  },
  posiciones(){return head("Temporada 2026","Tabla de posiciones","Sistema FIBA: 2 puntos por victoria y 1 por derrota. Desempate por diferencia de puntos.")+standTable()},
  equipos(){
    const st=standings(),ps=players();
    const rows=D.equipos.map(e=>{const gs=fin().filter(g=>g.local===e.nombre||g.visita===e.nombre),t={pts:0};K.forEach(k=>t[k]=0);
      gs.forEach(g=>{const s=sum(g.local===e.nombre?g.boxLocal:g.boxVisita);t.pts+=s.pts;K.forEach(k=>t[k]+=s[k])});const c=gs.length||1;
      return{e,pj:gs.length,ppg:t.pts/c,rpg:(t.oreb+t.dreb)/c,apg:t.ast/c,spg:t.stl/c,bpg:t.blk/c,tpg:t.tov/c,fg:pct(t.p2m+t.p3m,t.p2a+t.p3a),p3:pct(t.p3m,t.p3a),ft:pct(t.ftm,t.fta)}});
    const sel=S.cTeam||D.equipos[0]?.nombre,eq=D.equipos.find(e=>e.nombre===sel)||{},stat=new Map(ps.filter(p=>p.team===sel).map(p=>[String(p.num),p]));
    const plant=(eq.plantilla||[]).map(j=>({...j,s:stat.get(String(j.num))}));
    const inPl=new Set((eq.plantilla||[]).map(j=>String(j.num)));ps.filter(p=>p.team===sel&&!inPl.has(String(p.num))).forEach(p=>plant.push({num:p.num,nombre:p.nombre+" *",s:p}));plant.sort((x,y)=>n(x.num)-n(y.num));
    const dash=`<td>–</td>`.repeat(7);
    return head("Temporada 2026","Equipos","Promedios por partido de cada equipo, plantilla oficial inscrita y cuerpo técnico.")+
    `<div class="tbl"><table><thead><tr><th class="l">Equipo</th><th>PJ</th><th>PTS</th><th>REB</th><th>AST</th><th>ROB</th><th>TAP</th><th>PER</th><th>TC%</th><th>3P%</th><th>TL%</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="l"><b>${tn(r.e.nombre)}</b></td><td>${r.pj}</td>${[r.ppg,r.rpg,r.apg,r.spg,r.bpg,r.tpg].map(x=>`<td>${r.pj?x.toFixed(1):"–"}</td>`).join("")}<td>${r.fg}</td><td>${r.p3}</td><td>${r.ft}</td></tr>`).join("")}</tbody></table></div>
    <div class="filters" style="margin-top:26px"><h3 style="font-size:20px;margin-right:8px">Plantilla</h3><select id="cTeam">${D.equipos.map(e=>`<option ${e.nombre===sel?"selected":""}>${esc(e.nombre)}</option>`).join("")}</select></div>
    <div class="grid2" style="grid-template-columns:minmax(0,2.2fr) minmax(240px,1fr);align-items:start">
    <div class="tbl"><table><thead><tr><th class="l">#</th><th class="l">Jugador</th><th>PJ</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>ROB</th><th>VAL</th></tr></thead><tbody>${plant.map(j=>`<tr><td class="l">${esc(j.num)}</td><td class="l"><b>${esc(j.nombre)}</b></td>${j.s?`<td>${j.s.gp}</td><td>${fmin(j.s.mpg)}</td>${[j.s.ppg,j.s.rpg,j.s.apg,j.s.spg,j.s.vpg].map(x=>`<td>${x.toFixed(1)}</td>`).join("")}`:`<td>0</td>${`<td>–</td>`.repeat(6)}`}</tr>`).join("")}</tbody></table></div>
    ${plant.some(j=>j.nombre.endsWith(" *"))?`<p style="grid-column:1/-1;order:3;font-size:13px;color:var(--slate)">* Jugó según la planilla FIBA pero no aparece en el listado oficial de inscritos.</p>`:""}<section class="card">${eq.logo?`<img src="${esc(eq.logo)}" alt="${esc(eq.nombre)}" style="height:120px;width:auto;max-width:100%;object-fit:contain;display:block;margin:0 auto 14px">`:""}<h3>Cuerpo técnico</h3>${(eq.tecnico||[]).map(t=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><b style="font-size:14px">${esc(t.nombre)}</b><div style="font-size:12px;color:var(--slate)">${esc(t.cargo)}</div></div>`).join("")||`<p style="color:var(--slate)">Sin registrar.</p>`}</section>
    </div>`;
  },
  jugadores(){
    let ps=players();if(S.pTeam)ps=ps.filter(p=>p.team===S.pTeam);
    ps=ps.map(p=>({...p,fgp:p.fga?100*p.fgm/p.fga:-1,p3p:p.p3a?100*p.p3m/p.p3a:-1,ftp:p.fta?100*p.ftm/p.fta:-1}));
    const{k,d}=S.pSort;ps.sort((a,b)=>typeof a[k]==="string"?d*a[k].localeCompare(b[k]):d*(a[k]-b[k]));
    const C=[["nombre","Jugador","l"],["team","Equipo","l"],["gp","PJ"],["mpg","MIN",1],["ppg","PTS",1],["rpg","REB",1],["orpg","RO",1],["drpg","RD",1],["apg","AST",1],["spg","ROB",1],["bpg","TAP",1],["tpg","PER",1],["fgp","TC%",2],["p3p","3P%",2],["ftp","TL%",2],["vpg","VAL",1]];
    const cell=(p,c)=>{const v=p[c[0]];if(c[0]==="mpg")return fmin(v);return c[3]===2?(v<0?"–":v.toFixed(1)):c[3]?v.toFixed(1):esc(v)};
    return head("Temporada 2026","Estadísticas de jugadores","Promedios por partido jugado. Tocá un encabezado para ordenar.")+
    `<div class="filters"><select id="pTeam"><option value="">Todos los equipos</option>${D.equipos.map(e=>`<option ${e.nombre===S.pTeam?"selected":""}>${esc(e.nombre)}</option>`).join("")}</select><button class="btn orange" id="xls" ${fin().length?"":"disabled"}>Descargar Excel (Latin Basket)</button></div>`+
    (ps.length?`<div class="tbl"><table><thead><tr>${C.map(c=>`<th class="s ${c[2]==="l"?"l":""} ${c[0]===k?"on":""}" data-s="${c[0]}">${c[1]}${c[0]===k?(d<0?" ↓":" ↑"):""}</th>`).join("")}</tr></thead><tbody>${ps.map(p=>`<tr>${C.map(c=>`<td class="${c[2]==="l"?"l":""}">${c===C[0]?`<b>${cell(p,c)}</b>`:cell(p,c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<div class="empty"><b>Sin jugadores todavía</b>Las estadísticas se llenan con cada acta oficial cargada.</div>`);
  },
  fotos(){
    setTimeout(()=>{const el=$("#galLnbm");if(el&&!renderGaleria(FOTOS,"",el))el.innerHTML=`<div class="empty"><b>Galería en preparación</b>Las fotos de cada jornada de la LNBF se publican aquí.</div>`},0);
    return head("Temporada 2026","Fotos","Imágenes de las jornadas de la Liga Nacional de Baloncesto Femenino ICN 2026. Tocá una foto para verla en grande.")+`<div id="galLnbm"></div>`;
  },
  lideres(){
    const ps=players(),maxGp=Math.max(0,...ps.map(p=>p.gp)),q=ps.filter(p=>p.gp>=Math.ceil(maxGp/2));
    const top=(k,arr=q)=>[...arr].sort((a,b)=>b[k]-a[k]).slice(0,10);
    const pq=(m,a,min)=>q.filter(p=>p[a]>=min).map(p=>({...p,_p:100*p[m]/p[a]})).sort((a,b)=>b._p-a._p).slice(0,10);
    return head("Temporada 2026","Líderes","Top 10 por promedio. Para clasificar hay que haber jugado al menos la mitad de los partidos del líder en juegos.")+
    `<div class="grid3">
    ${board("Puntos","Por partido",top("ppg"),p=>p.ppg.toFixed(1),p=>p.pts+" totales")}
    ${board("Rebotes","Por partido",top("rpg"),p=>p.rpg.toFixed(1),p=>p.reb+" totales")}
    ${board("Asistencias","Por partido",top("apg"),p=>p.apg.toFixed(1),p=>p.ast+" totales")}
    ${board("Robos","Por partido",top("spg"),p=>p.spg.toFixed(1),p=>p.stl+" totales")}
    ${board("Tapones","Por partido",top("bpg"),p=>p.bpg.toFixed(1),p=>p.blk+" totales")}
    ${board("Valoración","Por partido",top("vpg"),p=>p.vpg.toFixed(1),p=>p.val+" totales")}
    ${board("Rebotes ofensivos","Por partido",top("orpg"),p=>p.orpg.toFixed(1),p=>p.oreb+" totales")}
    ${board("Minutos","Por partido",top("mpg"),p=>p.mpg.toFixed(1),p=>p.min+" totales")}
    ${board("Triples anotados","Total",top("p3m",ps),p=>p.p3m,p=>p.p3a+" intentos")}
    ${board("% Tiros de campo","Mín. 10 intentos",pq("fgm","fga",10),p=>p._p.toFixed(1),p=>p.fgm+"/"+p.fga)}
    ${board("% Triples","Mín. 5 intentos",pq("p3m","p3a",5),p=>p._p.toFixed(1),p=>p.p3m+"/"+p.p3a)}
    ${board("% Tiros libres","Mín. 5 intentos",pq("ftm","fta",5),p=>p._p.toFixed(1),p=>p.ftm+"/"+p.fta)}
    </div>`;
  },
  partido(id){
    const g=D.partidos.find(x=>x.id===id);if(!g)return`<div class="empty"><b>Partido no encontrado</b><a href="#calendario">Volver al calendario</a></div>`;
    const[a,b]=score(g);
    const box=(team,rows)=>{const t=sum(rows);return `<section class="stack" style="gap:10px"><h3 style="font-size:19px">${tn(team)}</h3><div class="tbl"><table><thead><tr><th class="l">#</th><th class="l">Jugador</th><th>MIN</th><th>PTS</th><th>2P</th><th>3P</th><th>TL</th><th>RO</th><th>RD</th><th>REB</th><th>AST</th><th>ROB</th><th>TAP</th><th>PER</th><th>FP</th><th>VAL</th></tr></thead><tbody>${(rows||[]).map(r=>`<tr><td class="l">${esc(r.num)}</td><td class="l"><b>${esc(r.nombre)}</b></td><td>${fmin(r.min)}</td><td class="b">${pts(r)}</td><td>${n(r.p2m)}/${n(r.p2a)}</td><td>${n(r.p3m)}/${n(r.p3a)}</td><td>${n(r.ftm)}/${n(r.fta)}</td><td>${n(r.oreb)}</td><td>${n(r.dreb)}</td><td>${n(r.oreb)+n(r.dreb)}</td><td>${n(r.ast)}</td><td>${n(r.stl)}</td><td>${n(r.blk)}</td><td>${n(r.tov)}</td><td>${n(r.pf)}</td><td>${val(r)}</td></tr>`).join("")}</tbody><tfoot><tr><td></td><td class="l">Totales</td><td>${fmin(t.min)}</td><td>${t.pts}</td><td>${t.p2m}/${t.p2a}</td><td>${t.p3m}/${t.p3a}</td><td>${t.ftm}/${t.fta}</td><td>${t.oreb}</td><td>${t.dreb}</td><td>${t.reb}</td><td>${t.ast}</td><td>${t.stl}</td><td>${t.blk}</td><td>${t.tov}</td><td>${t.pf}</td><td></td></tr></tfoot></table></div></section>`};
    return `<div class="stack"><a href="#calendario" style="color:var(--purple);font-weight:600;text-decoration:none">← Calendario</a>
    <div class="sb"><div class="t">${lg(g.local)}<span>${esc(g.local)}</span></div><div class="sc">${a} – ${b}</div><div class="t"><span>${esc(g.visita)}</span>${lg(g.visita)}</div><div class="meta">Jornada ${esc(g.jornada)} · ${esc(fdate(g.fecha))} · ${esc(g.sede||"")}${g.parciales?`<br>Parciales: ${g.parciales.map(esc).join(" · ")}`:""}${g.arbitros?`<br>Árbitros: ${g.arbitros.map(esc).join(", ")}`:""}</div></div>
    ${box(g.local,g.boxLocal)}${box(g.visita,g.boxVisita)}</div>`;
  }
};
function playoffs(){
  const P=D.playoffs||[];if(!P.length)return"";
  return `<div class="jhead" style="margin-top:30px">Playoffs · al mejor de 3</div><div class="tbl"><table><thead><tr><th class="l">Fecha</th><th class="l">Hora</th><th class="l">Serie</th><th class="l">Encuentro</th></tr></thead><tbody>${P.map(x=>`<tr><td class="l">${esc(fdate(x.fecha))}</td><td class="l">${esc(x.hora)}</td><td class="l"><b>${esc(x.ronda)}</b></td><td class="l">${esc(x.juego)}</td></tr>`).join("")}</tbody></table></div>`;
}
function head(e,t,p){return `<div class="head"><div class="eyebrow">${e}</div><h2>${t}</h2><p>${p}</p></div>`}

function route(){
  const h=(location.hash||"#inicio").slice(1);
  let v=h,arg;if(h.startsWith("partido-")){v="partido";arg=h.slice(8)}
  if(!V[v])v="inicio";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v||(v==="partido"&&a.dataset.v==="calendario")));
  $("#view").innerHTML=V[v](arg);
}
window.addEventListener("hashchange",()=>{route();scrollTo(0,0)});
document.addEventListener("change",e=>{if(e.target.id==="pTeam"){S.pTeam=e.target.value;route()}if(e.target.id==="cTeam"){S.cTeam=e.target.value;route()}});
document.addEventListener("click",e=>{
  const th=e.target.closest("th[data-s]");if(th){const k=th.dataset.s;S.pSort=S.pSort.k===k?{k,d:-S.pSort.d}:{k,d:["nombre","team"].includes(k)?1:-1};route();return}
  if(e.target.id==="xls")exportXlsx();
});

/* ---- Exportación Latin Basket ---- */
function exportXlsx(){
  if(typeof XLSX==="undefined"){toast("No cargó el generador de Excel, recargá la página");return}
  const f=fin().sort((a,b)=>n(a.jornada)-n(b.jornada)),gid=g=>`LNBF26-J${g.jornada}-${g.id}`;
  const H=["No","Player","MIN","PTS","2PM","2PA","3PM","3PA","FTM","FTA","OREB","DREB","REB","AST","STL","BLK","TO","PF"];
  const row=r=>[r.num,r.nombre,n(r.min),pts(r),n(r.p2m),n(r.p2a),n(r.p3m),n(r.p3a),n(r.ftm),n(r.fta),n(r.oreb),n(r.dreb),n(r.oreb)+n(r.dreb),n(r.ast),n(r.stl),n(r.blk),n(r.tov),n(r.pf)];
  const games=[["GameID","Round","Date","Venue","Home","Away","Home PTS","Away PTS"],...f.map(g=>{const[a,b]=score(g);return[gid(g),g.jornada,g.fecha,g.sede||"",g.local,g.visita,a,b]})];
  const boxes=[["GameID","Round","Date","Team","Opponent","H/A",...H]];
  f.forEach(g=>{(g.boxLocal||[]).forEach(r=>boxes.push([gid(g),g.jornada,g.fecha,g.local,g.visita,"H",...row(r)]));(g.boxVisita||[]).forEach(r=>boxes.push([gid(g),g.jornada,g.fecha,g.visita,g.local,"A",...row(r)]))});
  const ps=players().sort((a,b)=>a.team.localeCompare(b.team)||b.ppg-a.ppg),r1=x=>Math.round(x*10)/10;
  const tot=[["Team","No","Player","GP","MIN","PTS","2PM","2PA","3PM","3PA","FTM","FTA","OREB","DREB","REB","AST","STL","BLK","TO","PF","EFF"],...ps.map(p=>[p.team,p.num,p.nombre,p.gp,p.min,p.pts,p.p2m,p.p2a,p.p3m,p.p3a,p.ftm,p.fta,p.oreb,p.dreb,p.reb,p.ast,p.stl,p.blk,p.tov,p.pf,p.val])];
  const avg=[["Team","No","Player","GP","MPG","PPG","RPG","APG","SPG","BPG","TOPG","FG%","3P%","FT%","EFF"],...ps.map(p=>[p.team,p.num,p.nombre,p.gp,r1(p.mpg),r1(p.ppg),r1(p.rpg),r1(p.apg),r1(p.spg),r1(p.bpg),r1(p.tpg),p.fga?r1(100*p.fgm/p.fga):"",p.p3a?r1(100*p.p3m/p.p3a):"",p.fta?r1(100*p.ftm/p.fta):"",r1(p.vpg)])];
  const st=[["Pos","Team","GP","W","L","PF","PA","DIFF","PTS"],...standings().map((t,i)=>[i+1,t.team,t.pj,t.g,t.p,t.pf,t.pc,t.dif,t.pts])];
  const wb=XLSX.utils.book_new();
  [["Games",games],["Box Scores",boxes],["Player Totals",tot],["Player Averages",avg],["Standings",st]].forEach(([nm,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),nm));
  XLSX.writeFile(wb,`LNBF_2026_LatinBasket_${new Date().toISOString().slice(0,10)}.xlsx`);
}

fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{D=d;$("#upd").textContent=d.actualizado?`Actualizado: ${fdate(d.actualizado)}`:"";route()})
.catch(()=>{$("#view").innerHTML=`<div class="empty"><b>No se pudieron cargar las estadísticas</b>Recargá la página en unos segundos.</div>`});
</script>
</body>
